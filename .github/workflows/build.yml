name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash ./gradlew --no-daemon build
      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: trueuuid-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
