name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash ./gradlew --no-daemon build
      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: trueuuid-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/trueuuid-1.0.9-clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.10 build/libs/trueuuid-1.0.10-forge1.20.1.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TrueUUID 1.0.10 — Forge 1.20.1" \
            --notes "Based on upstream TrueUUID 1.0.9. Adds automatic migration of same-name offline player data after successful authenticated login for Mojang and MSL/Yggdrasil paths."
