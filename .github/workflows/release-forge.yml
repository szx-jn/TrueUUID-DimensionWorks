name: TrueUUID 1.0.9 自动继承版正式发布

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "必须与 gradle.properties 中的固定版本一致"
        required: true
        default: "1.0.9-dimensionworks.1"
        type: string
      release_features:
        description: "新增功能；每行一条 feat(scope): 描述"
        required: false
        default: "feat(auth): 真实会话认证成功后自动备份并继承同名离线玩家数据"
        type: string
      release_fixes:
        description: "问题修复；每行一条 fix(scope): 描述"
        required: false
        default: "fix(migration): 归档重复旧 UUID 数据并保护已有目标进度"
        type: string
      release_other:
        description: "其他变更；每行一条 docs(scope): 描述"
        required: false
        default: "docs(auth): 基于 1.0.9 保留原认证协议和 MSL 配置并说明恢复方法"
        type: string

permissions:
  contents: write

concurrency:
  group: trueuuid-forge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出固定源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 核对版本与 1.0.9 认证基线
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/verify_release.py --source-only
      - name: 构建 Forge 发布 JAR
        run: ./gradlew build -x test --no-daemon --console=plain
      - name: 校验 Forge 1.20.1 正式 JAR
        run: python3 scripts/verify_release.py
      - name: 生成本次发行说明与摘要
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_FEATURES: ${{ inputs.release_features }}
          RELEASE_FIXES: ${{ inputs.release_fixes }}
          RELEASE_OTHER: ${{ inputs.release_other }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          jar = Path('build/libs') / f'trueuuid-{version}-forge1.20.1.jar'
          out = Path('dist')
          out.mkdir(exist_ok=True)
          target = out / jar.name
          target.write_bytes(jar.read_bytes())
          (out / 'SHA256SUMS').write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + '\n')
          lines = [f'TrueUUID {version} · Forge 1.20.1 · Java 17', '']
          for category in ['RELEASE_FEATURES', 'RELEASE_FIXES', 'RELEASE_OTHER']:
              lines.extend(line.strip() for line in os.environ.get(category, '').splitlines() if line.strip())
          lines.extend(['', '基于社区版 1.0.9；客户端与服务端同步使用该版本。保留原认证协议、旧 MSL 配置和全部迁移备份。',
                        '本次发布仅执行构建和静态产物校验，未进行游戏内登录或迁移验收。'])
          (out / 'release-notes.md').write_text('\n'.join(lines) + '\n')
          PY
      - name: 发布固定 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "该版本已存在，拒绝改写已发布资产。" >&2
            exit 1
          fi
          gh release create "$tag" \
            "dist/trueuuid-${RELEASE_VERSION}-forge1.20.1.jar" "dist/SHA256SUMS" \
            --target "$GITHUB_SHA" --title "TrueUUID ${RELEASE_VERSION} — Forge 1.20.1" \
            --notes-file dist/release-notes.md
